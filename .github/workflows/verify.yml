name: verify

# Deterministic verification only. No LM Studio, no GPU, no network model
# downloads — everything here must pass on a bare CI runner.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.6"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot ${{ env.GODOT_VERSION }} (headless-capable)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          mkdir -p ~/godot && cd ~/godot
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          FILE="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fL --retry 3 -o godot.zip "$BASE/$FILE"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          chmod +x godot

      - name: Godot version
        run: ~/godot/godot --version

      - name: Import project (builds the global class registry)
        # A fresh clone has no .godot/ cache, so class_name types are not
        # registered and every script referencing them fails to parse. This is
        # the same step the README tells a human to run once.
        run: |
          set -euo pipefail
          ~/godot/godot --headless --editor --quit --path . 2>&1 | tail -5
          test -f .godot/global_script_class_cache.cfg

      - name: Project parses
        run: |
          set -euo pipefail
          ~/godot/godot --headless --path . --quit 2>&1 | tee parse.log || true
          if grep -q "Parse Error" parse.log; then
            echo "::error::Parse errors present"
            grep "Parse Error" parse.log
            exit 1
          fi

      - name: Self-test — entrypoint parity
        run: ~/godot/godot --headless --path . --script scripts/arena/entrypoint_parity_selftest.gd 2>&1 | tee out.log; grep -q "PARITY OK" out.log

      - name: Self-test — model policy
        run: ~/godot/godot --headless --path . --script scripts/arena/model_policy_selftest.gd 2>&1 | tee out.log; grep -qE "[0-9]+ checks" out.log && grep -qE "0 failure" out.log

      - name: Self-test — coherence
        run: |
          ~/godot/godot --headless --path . --script scripts/arena/coherence_selftest.gd 2>&1 | tee out.log
          grep -q "RESULT" out.log && grep -q "SEPARATED" out.log
          ! grep -qE "[1-9][0-9]* failure" out.log

      - name: Self-test — cinematic bridge
        run: ~/godot/godot --headless --path . --script scripts/arena/cinematic_selftest.gd 2>&1 | tee out.log; grep -qE "[0-9]+ checks" out.log && grep -qE "0 failure" out.log

      - name: Self-test — scar lattice
        run: ~/godot/godot --headless --path . --script scripts/arena/scar_lattice_selftest.gd 2>&1 | tee out.log; grep -qE "[0-9]+ checks" out.log && grep -qE "0 failure" out.log

      - name: Self-test — system-role compatibility
        run: ~/godot/godot --headless --path . --script scripts/arena/compat_selftest.gd 2>&1 | tee out.log; grep -qE "[0-9]+ checks" out.log && grep -qE "0 failure" out.log

      - name: Self-test — turn order and swap cost
        run: ~/godot/godot --headless --path . --script scripts/arena/turn_order_selftest.gd 2>&1 | tee out.log; grep -q "TURN ORDER OK" out.log

      - name: Self-test — VRAM estimate
        run: ~/godot/godot --headless --path . --script scripts/arena/vram_selftest.gd 2>&1 | tee out.log; grep -q "VRAM OK" out.log

      - name: Self-test — speech cleaning
        run: ~/godot/godot --headless --path . --script scripts/arena/speech_clean_selftest.gd 2>&1 | tee out.log; grep -q "SPEECH CLEAN OK" out.log

      - name: Adversarial pass
        run: ~/godot/godot --headless --path . --script tools/adversarial.gd 2>&1 | tee out.log; grep -q "ADVERSARIAL OK" out.log

      - name: Offline behaviour (LM Studio absent)
        run: ~/godot/godot --headless --path . --script tools/offline_selftest.gd 2>&1 | tee out.log; grep -q "OFFLINE OK" out.log

      - name: Documentation lint
        # README.md once shipped a command reading "toolserify.cmd" — a vertical
        # tab had replaced a backslash during a scripted edit. It rendered
        # almost correctly and the command did not exist.
        run: python3 tools/lint_docs.py

      - name: Private path lint
        # Five scripts hardcoded ../extinct_os/ — a PRIVATE sibling checkout —
        # as their only roster path, so they were dead on arrival in a public
        # clone. The author cannot see this: the file is on their disk.
        run: python3 tools/lint_private_paths.py

      - name: Template coverage lint
        # TEMPLATES.md is the showcase a visitor reads. It advertised 45
        # templates and described 43; the count and the code were kept in
        # step by hand.
        run: python3 tools/lint_templates.py

      - name: Silent-exit lint
        # Every silent failure in this project's history looked like success.
        # A non-zero exit must say why.
        run: python3 tools/lint_exits.py

      - name: Workflow YAML lint
        # A workflow that does not parse never runs, so CI cannot catch this
        # class itself. It was broken once by an unquoted "RESULT: SEPARATED".
        run: |
          pip install --quiet pyyaml
          python3 tools/lint_workflows.py

      - name: User tools degrade cleanly with no LM Studio
        # CI has no LM Studio, which is exactly the state a first-time user hits
        # before starting the server. These tools are user-facing and were not
        # covered at all: a parse error or a crash would only surface for them.
        run: |
          set -uo pipefail
          echo "--- doctor (expect exit 1, NOT READY) ---"
          ~/godot/godot --headless --path . --script tools/doctor.gd > d.log 2>&1 || true
          grep -q "SILICON ARENA DOCTOR" d.log
          grep -q "NOT READY" d.log
          grep -qi "start LM Studio" d.log

          echo "--- build_roster (expect a clear refusal) ---"
          ~/godot/godot --headless --path . --script tools/build_roster.gd > r.log 2>&1 || true
          grep -qi "LM Studio" r.log

          echo "--- prove (A and C are deterministic; B must SKIP, not fail) ---"
          ~/godot/godot --headless --path . --script tools/prove.gd > p.log 2>&1 || true
          grep -q "PROOF OK" p.log
          grep -q "claim A" p.log && grep -q "PROVEN" p.log
          grep -q "claim B" p.log && grep -q "SKIPPED" p.log
          grep -q "claim C" p.log

      - name: Configs, presets and required files
        run: ~/godot/godot --headless --path . --script tools/verify_configs.gd 2>&1 | tee cfg.log; grep -q "CONFIGS OK" cfg.log

      - name: Preset legality is enforced (negative control)
        # Proves the config check can actually fail. A suite that only ever
        # passes is not evidence.
        run: |
          set -euo pipefail
          cp presets.json presets.bak
          python3 - <<'PY'
          import json
          d = json.load(open("presets.json"))
          d[0][0] = {"color":"ff0000","name":"NEGATIVE 9B",
                     "model":"lmstudio-community/Qwen3.5-9B-GGUF/Qwen3.5-9B-Q4_K_M.gguf"}
          json.dump(d, open("presets.json","w"), indent=1)
          PY
          if ~/godot/godot --headless --path . --script tools/verify_configs.gd 2>&1 | grep -q "CONFIGS OK"; then
            echo "::error::validator passed a 9B preset — the ceiling is not enforced"
            mv presets.bak presets.json
            exit 1
          fi
          mv presets.bak presets.json
          echo "negative control OK: a 9B preset is rejected"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: |
            parse.log
            out.log
            cfg.log
          retention-days: 7
